name: AWS Production - Pipeline

on:
  schedule:
    - cron: "0 3 * * 1-5" # Runs between 8-9 AM GMT+5 Mon-Fri

  workflow_dispatch: # So the whole chain can be triggered manually
    inputs:
      skip_checks:
        description: "Deploy even if the commit check fails (logged)"
        type: boolean
        default: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    # Runs on manual runs too, so the commit check gets its base; should_run only matters for scheduled runs.
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - name: Find last deploy attempt
        id: last-run
        uses: actions/github-script@v7
        with:
          script: |
            // A run's own "success" can't be the baseline: runs that skipped
            // for no changes and runs where job2/job3 were skipped both report
            // success. Only the newest run that attempted a deploy counts, and
            // only if it reached the end of the chain. Otherwise `since` stays
            // empty and this run deploys again, even with no new commits.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'aws-production-pipeline.yml',
              status: 'completed',
              per_page: 30,
            });
            let first = true;
            for (const run of data.workflow_runs) {
              const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const attempted = jobs.some((j) => j.name.startsWith('job1') && j.conclusion !== 'skipped');
              if (!attempted) continue;
              const complete = jobs.some((j) => j.name.startsWith('job3') && j.conclusion === 'success');
              if (first) {
                core.info(`Last deploy attempt: ${run.html_url} (created ${run.created_at}, complete: ${complete})`);
                // created_at, not run_started_at: re-running a failed job moves
                // run_started_at forward, but job1 deployed at the original time.
                if (complete) core.setOutput('since', run.created_at);
                first = false;
              }
              // The commit check compares with the newest COMPLETE deploy, even when a newer attempt failed.
              if (complete) {
                core.setOutput('base_time', run.created_at);
                return;
              }
            }

      - name: Find the aspose-blog commit the last complete deploy shipped
        id: base
        uses: actions/github-script@v7
        env:
          BASE_TIME: ${{ steps.last-run.outputs.base_time }}
        with:
          github-token: ${{ secrets.REPO_TOKEN }}
          script: |
            // master as it was when that deploy started = the "after" of the newest push before it. Push events,
            // not commit dates: a commit made earlier but pushed later still counts as new.
            const t = process.env.BASE_TIME;
            if (!t) { core.info('No complete deploy found: the commit check covers the newest commit only.'); return; }
            const pushes = await github.paginate('GET /repos/{owner}/{repo}/activity', {
              owner: 'Aspose', repo: 'aspose-blog', ref: 'refs/heads/master', activity_type: 'push', per_page: 100,
            }, (res, done) => { if (res.data.some((a) => new Date(a.timestamp) <= new Date(t))) done(); return res.data; });
            const hit = pushes.find((a) => new Date(a.timestamp) <= new Date(t));
            if (hit) core.setOutput('base', hit.after);
            core.info(hit ? `Last complete deploy (${t}) shipped ${hit.after.slice(0, 10)}` : `No push found before ${t}`);

      - name: Check for new commits in content repo since last complete deploy
        id: check
        uses: actions/github-script@v7
        env:
          SINCE: ${{ steps.last-run.outputs.since }}
        with:
          github-token: ${{ secrets.REPO_TOKEN }}
          script: |
            const since = process.env.SINCE;
            if (!since) {
              core.info('Last deploy attempt did not complete — running.');
              core.setOutput('should_run', true);
              return;
            }

            const { data: commits } = await github.rest.repos.listCommits({
              owner: 'Aspose',
              repo: 'aspose-blog',
              sha: 'master',
              since,
              per_page: 1,
            });

            // A commit made before the baseline but pushed after it has an old
            // date, so the commit list alone misses it. pushed_at counts any
            // branch, which at worst causes an extra deploy.
            const { data: contentRepo } = await github.rest.repos.get({
              owner: 'Aspose',
              repo: 'aspose-blog',
            });
            const pushedSince = new Date(contentRepo.pushed_at) > new Date(since);

            core.info(`Last complete deploy created at: ${since}`);
            core.info(`New commits in Aspose/aspose-blog since then: ${commits.length}`);
            core.info(`Last push to Aspose/aspose-blog: ${contentRepo.pushed_at}`);
            core.setOutput('should_run', commits.length > 0 || pushedSince);

  commit-check:
    needs: check-changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.should_run == 'true')
    uses: ./.github/workflows/commit-check.yml
    with:
      base: ${{ needs.check-changes.outputs.base }}
      skip: ${{ inputs.skip_checks == true }}
    secrets: inherit

  job1:
    needs: commit-check
    # commit-check runs only when a deploy is due (same condition job1 had), so its success is the gate.
    if: ${{ !cancelled() && needs.commit-check.result == 'success' }}
    uses: ./.github/workflows/production-aws-deploy-blog-posts.yml
    secrets: inherit # Pass secrets if your sub-workflows need them

  job2:
    needs: job1
    # Required: a manual run skips check-changes, and a job without its own `if`
    # is skipped when anything up its needs chain was skipped.
    if: ${{ !cancelled() && needs.job1.result == 'success' }}
    uses: ./.github/workflows/production-aws-deploy-home-pages.yml
    secrets: inherit

  job3:
    needs: job2
    if: ${{ !cancelled() && needs.job2.result == 'success' }}
    uses: ./.github/workflows/production-aws-deploy-tags.yml
    secrets: inherit

  failure-report:
    needs: [commit-check, job1, job2, job3]
    # Memory and log report for deploy failures; a failed commit check has its own summary.
    if: ${{ failure() && needs.commit-check.result != 'failure' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/failure-report.yml
