name: Commit Watch

# Every 15 minutes: if Aspose/aspose-blog got new commits since the last watch run, run the commit check on them.
# A failure here emails the person who last edited this file's schedule (GitHub's rule for scheduled runs).
# Redirects.json is read live from the repo, so this is the only alert for it: it cannot wait for a deploy.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  new-commits:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      since: ${{ steps.find.outputs.since }}
      run: ${{ steps.find.outputs.run }}
    steps:
      - name: New commits since the last watch run?
        id: find
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_TOKEN }}
          script: |
            // Baseline: creation time of the newest earlier run of this workflow (any result), so a failed run's
            // commits are not checked again and again; without one, look back 1 hour.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'commit-watch.yml', per_page: 5,
            });
            const prev = data.workflow_runs.find((r) => r.id !== context.runId);
            const since = prev ? prev.created_at : new Date(Date.now() - 3600e3).toISOString();
            const { data: repo } = await github.rest.repos.get({ owner: 'Aspose', repo: 'aspose-blog' });
            const pushed = new Date(repo.pushed_at) > new Date(since);
            core.info(`Since ${since}; last push to aspose-blog ${repo.pushed_at}; check: ${pushed}`);
            core.setOutput('since', since);
            core.setOutput('run', pushed);

  check:
    needs: new-commits
    if: needs.new-commits.outputs.run == 'true'
    uses: ./.github/workflows/commit-check.yml
    with:
      since: ${{ needs.new-commits.outputs.since }}
    secrets: inherit
