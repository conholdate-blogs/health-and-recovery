# Rules we audit and fix by (SK, 2026-11-12: "maintain a page on the website to structurally list our rules").
# Published at /rules/ (scripts/site_pages.py). One entry per rule; `checks` are the audit checks that enforce it
# (their Fix guide rows link back here). Revise a rule by editing it: set `status` and add a line to `history`.
# status: active | proposed | retired

areas:
  URL: URLs
  RED: Redirects
  TR: Translations
  TD: Titles and descriptions
  IDX: Indexing
  TPL: Templates
  AI: AI readiness
  AUD: Our audit
  PROC: Process

rules:
  - id: URL-1
    rule: Every post URL is English; a translation is published at /<lang>/<English url>/.
    why: Language versions pair by URL; translated slugs broke internal links and hreflang pairs.
    set_by: Shoaib Khan
    date: 2026-11-11
    checks: [translated_url_mismatch, post_url_relative]
    status: active
  - id: URL-2
    rule: A URL without its trailing slash answers a permanent redirect (301) to the slash form.
    why: A temporary redirect (302) does not state which URL is the real one.
    set_by: Health and Recovery Agent
    date: 2026-11-12
    checks: [slash_redirect_temporary]
    status: active
  - id: RED-1
    rule: "No redirect entries for junk URLs: gist placeholders, a host in the key, # fragments, query strings, double slashes, non-English slugs, upper-case copies of a target; and no redirect to the blog's home page (13 Nov 2026). Exception: a reviewed old URL that really existed (e.g. a moved post's old non-English slug) keeps its redirect to the new URL (tenant audit.repo.redirect_keep)."
    why: Such keys never match a real request or are not real blog URLs; they only grow the file. A redirect to the home page is a soft 404 for search engines; a gone URL should answer 404.
    set_by: Shoaib Khan
    date: 2026-11-11
    checks: [redirect_key_malformed]
    status: active
  - id: RED-2
    rule: Redirects.json is valid JSON at every commit; the one wanted new redirect is old URL -> corrected URL when a post's URL is fixed.
    why: An invalid file stopped every redirect of blog.aspose.com on 2 Nov 2026.
    set_by: Shoaib Khan
    date: 2026-11-03
    checks: [redirect_file_invalid, redirect_not_working, redirect_self_loop, redirect_target_bad]
    status: active
  - id: TR-1
    rule: Never translate product and brand names (e.g. Conholdate.Total for .NET), code, URLs, file and image paths, variable names, API endpoints, file formats and abbreviations.
    why: The blog translation agent's rule (translator.py, quality_validator.py); our untranslated checks skip these words.
    set_by: Translation Agent
    date: 2026-11-12
    checks: [post_text_untranslated, title_untranslated, description_untranslated]
    status: active
  - id: TR-2
    rule: A short title left in English counts as untranslated, e.g. "Convert CDR to PSD in C#" on a German page (3 or more translatable words).
    why: The searcher sees an English title; the verbs carry the meaning.
    set_by: Shoaib Khan
    date: 2026-11-12
    checks: [post_text_untranslated, title_untranslated]
    status: active
  - id: TR-3
    rule: When the English title or description is rewritten, the translations follow.
    why: blog.conholdate.com has 3,638 translations with titles from before an English rewrite (March 2026).
    set_by: Health and Recovery Agent
    date: 2026-11-12
    checks: [translation_stale]
    status: active
  - id: TR-4
    rule: Every translated page has its title and description in its own language, including home and listing pages (Hugo languages.<lang>.title and params.description).
    why: 22 translated home pages of blog.conholdate.cloud showed the English title.
    set_by: Health and Recovery Agent
    date: 2026-11-12
    checks: [title_untranslated, description_untranslated, section_index_untranslated]
    status: active
  - id: TR-5
    rule: Language menu names are each language's own name (日本語, 한국어, 繁體中文); Arabic, Persian and Hebrew render right to left.
    why: Readers look for their language in its own script; RTL text rendered left to right is hard to read.
    set_by: Shoaib Khan
    date: 2026-11-11
    checks: [language_name_wrong, rtl_direction_missing]
    status: active
  - id: TD-1
    rule: Search titles 10-70 characters wide, descriptions 50-170 (CJK characters count double), on every post file.
    why: Google cuts longer ones and rewrites very short ones.
    set_by: Health and Recovery Agent
    date: 2026-10-20
    checks: [title_length, description_length, post_title_length, post_description_length]
    status: active
  - id: IDX-1
    rule: Tag pages are noindex, follow and out of the sitemaps while most tags hold one post; robots.txt does not block them.
    why: Thin tag pages outnumber posts and compete with them; a blocked page's noindex is never read.
    set_by: Shoaib Khan
    date: 2026-11-11
    checks: [tag_pages_thin, sitemap_lists_tag_pages, robots_blocked]
    status: active
  - id: IDX-2
    rule: Utility pages (/search/, /archives/) are noindex, follow and out of the sitemaps.
    why: Thin pages with one-word titles; Google advises against indexing internal search pages.
    set_by: Health and Recovery Agent
    date: 2026-11-11
    checks: []
    status: active
  - id: IDX-3
    rule: Every post is under a section listed in params.mainSections, so the home page lists it.
    why: A post outside mainSections never appeared on blog.conholdate.cloud's home page.
    set_by: Health and Recovery Agent
    date: 2026-11-12
    checks: [post_outside_main_sections, category_page_unused]
    status: active
  - id: IDX-4
    rule: Listing pages from page 2 on are noindex, follow with a canonical to themselves (never to page 1).
    why: They earn no search clicks; a canonical to page 1 on an indexable page 2 sends a mixed signal.
    set_by: Health and Recovery Agent
    date: 2026-11-13
    checks: [canonical_elsewhere]
    status: active
  - id: IDX-5
    rule: When a blog has a single main section, its section page is noindex, follow and out of the sitemaps.
    why: It lists exactly the home page's posts in every language, a duplicate listing.
    set_by: Health and Recovery Agent
    date: 2026-11-13
    checks: [section_lists_home_posts]
    status: active
  - id: AUD-5
    rule: "Checks judge pages as search engines see them: noindex pages are skipped by the duplicate title/description and hreflang checks, and the noindex check covers only sitemap pages and homepages."
    why: Google ignores a noindex page's hreflang and does not index it, so it competes with nothing; flagging it would be a false finding (13 Nov, listing page 2 and tag pages).
    set_by: Shoaib Khan
    date: 2026-11-13
    checks: [description_duplicate, title_duplicate, hreflang_no_self, noindex]
    status: active
  - id: URL-3
    rule: Every post folder has its own URL in every language; two posts never share one.
    why: Hugo publishes only one of them, and which one can change by language and build (blog.conholdate.com, 16 Nov 2026).
    set_by: Health and Recovery Agent
    date: 2026-11-16
    checks: [post_url_duplicate]
    status: active
  - id: TD-2
    rule: "One H1 per page: the title the theme renders; post bodies start their headings at ##."
    why: Two posts on blog.conholdate.com repeated their title as '# ' in all 18 languages (13-16 Nov 2026).
    set_by: Health and Recovery Agent
    date: 2026-11-16
    checks: [post_body_h1, h1_multiple]
    status: active
  - id: TR-6
    rule: "A translation links the same pages as its English post (language prefix added where the translation exists); unused reference definitions do not count."
    why: "blog.conholdate.com, 17 Nov 2026: th/tr/vi '[27] Extract Text from Word' pointed at the JPG post; it worked, so no link check saw it. A '[15]' that no text used was counted as a broken link although it is never on the page."
    set_by: Health and Recovery Agent
    date: 2026-11-17
    checks: [link_differs_from_original]
    status: active
  - id: TD-3
    rule: "Shortcodes are written {{< name … >}} (or {{% … %}}); tools that edit posts never escape or strip < and >."
    why: "On blog.conholdate.com 4 English posts showed {{ gist … }} as text, without images and code (an optimizer escaped them, Jun 2026; a hand fix dropped the brackets). Found 17 Nov 2026 before they were retranslated."
    set_by: Health and Recovery Agent
    date: 2026-11-17
    checks: [post_shortcode_as_text]
    status: active
  - id: TD-4
    rule: "Front-matter titles and descriptions are plain text: no **, __, backticks or [text](url); a markup-only fix changes English and translations in one commit, so nothing is retranslated for it."
    why: "blog.conholdate.com, 18 Nov 2026: 989 post files carried ** in title, description or summary, shown as is in meta descriptions, social cards, JSON-LD and RSS. Shoaib Khan: '** is not a reason to send files for translation; it can be fixed here.'"
    set_by: Shoaib Khan
    date: 2026-11-18
    checks: [post_front_matter_markup]
    status: active
  - id: TR-7
    rule: "A translated title or description is a translation: one line, about as long as the English value; an LLM answer, steps, code or repeated characters send the post back for retranslation (a sheet record), not a hand patch."
    why: "blog.conholdate.com, 18 Nov 2026: 10 translated titles were the LLM's answer ('You can follow these steps to convert STL to PDF in C#: 1. …', code), one Dutch description ran into hundreds of zero-width characters."
    set_by: Health and Recovery Agent
    date: 2026-11-18
    checks: [translation_text_garbled]
    status: active
  - id: TR-8
    rule: "A translation keeps the English front-matter structure: same keys in English (cover:, caption:, never capa: or キャプション:), the cover block indented, values quoted \"…\" (never \\\"…\\\"); only the text values are translated."
    why: "blog.conholdate.com, 19 Nov 2026: the 2025 pipeline flattened the cover block in 424 translations (no cover image live) and wrapped values in \\\"…\\\" (ko/ja convert-html-to-bmp-in-java showed \\\"…\\\" as the Google title). Found by Shoaib Khan."
    set_by: Shoaib Khan
    date: 2026-11-19
    checks: [post_cover_lost, post_front_matter_escaped]
    status: active
  - id: TR-10
    rule: "The English version of every post in the translation queue is perfect before it is retranslated: it passes every English check of the check sheet and the English body check (scripts/ops/english_body_check.py), fixed here first."
    why: "Shoaib Khan, 19 Nov 2026: 'at least English version of those that are in translation queue should be perfect.' blog.conholdate.com: 3 English posts cut off by the optimizer and 18 text errors (sentences copied from other posts, typos) would have been copied into every language."
    set_by: Shoaib Khan
    date: 2026-11-19
    checks: [post_body_cut_off, post_raw_html_dropped]
    status: active
  - id: TD-5
    rule: "Tools that edit posts (optimizer, translator) never shorten a post by cutting it: the file still ends with its last section and link definitions, and every code block is closed."
    why: "blog.conholdate.com, 19 Nov 2026: the Blog Optimization Agent cut create-encrypted-zip-files-using-csharp (154 -> 70 lines, ended 'legacy PK'), build-your-own-google-docs-like-app and create-and-read-excel-files-in-python in Feb-Mar 2026; export-data-to-excel-in-java (371 -> 80) and add-footnotes-and-endnotes were cut and later restored."
    set_by: Health and Recovery Agent
    date: 2026-11-19
    checks: [post_body_cut_off]
    status: active
  - id: TR-9
    rule: "Fix translations here when the fix is mechanical or small (links, front matter, titles, a few lines); send a post to retranslation only when its English was really rewritten. A fix to a queued translation drops it from the queue, so it needs an ISSUE row when the rewrite still has to be translated."
    why: "Shoaib Khan, 18-19 Nov 2026: 'instead of putting translation for retranslation, we can resolve many things here.' blog.conholdate.com: 3,767 outdated translations, 442 of them behind small English changes."
    set_by: Shoaib Khan
    date: 2026-11-19
    checks: []
    status: active
  - id: TPL-1
    rule: "Nothing renders an element such as a <div> in <head> before the SEO tags: extend_head.html is the last include."
    why: On 3 Nov 2026 a language-switcher div pushed title, canonical and hreflang of blog.aspose.com into <body>.
    set_by: Shoaib Khan
    date: 2026-11-07
    checks: [head_closed_early, social_tags_in_body]
    status: active
  - id: TPL-2
    rule: Every translated page lists all its language versions with hreflang, including itself and an x-default.
    why: States the fallback page and keeps language versions paired.
    set_by: Shoaib Khan
    date: 2026-11-11
    checks: [hreflang_no_xdefault, hreflang_no_self, hreflang_missing]
    status: active
  - id: TPL-3
    rule: "Every language has a company menu id of exactly two parts, <venture>-<language>, in params.dynamicmenuid; Traditional Chinese is <venture>-zht."
    why: The menu script draws nothing for a three-part id; zh-hant pages of three blogs had no company bar (12 Nov 2026).
    set_by: Health and Recovery Agent
    date: 2026-11-12
    checks: [menu_id_invalid, menu_id_missing, menu_id_wrong_script]
    status: active
  - id: AUD-1
    rule: The target is 100 as Google sees the site; never relax a check to raise a score.
    why: The score is only useful if it matches what search engines see.
    set_by: Shoaib Khan
    date: 2026-11-11
    checks: []
    status: active
  - id: AUD-2
    rule: Hosts with up to 1,000 sitemap URLs are crawled in full; bigger ones keep a fixed half and a rotating half of the sample (unchecked and newest posts first) and recheck every page that failed last run.
    why: Exact counts on small blogs; growing coverage and verified fixes on big ones.
    set_by: Shoaib Khan
    date: 2026-11-12
    checks: []
    status: active
  - id: AUD-3
    rule: Every issue found by hand becomes a check (tested, tried on the blog being fixed and the blogs already fixed, never on blogs still waiting their turn), then the blog is rescanned.
    why: Hand-found issues otherwise return unseen; waiting blogs get every check on their turn (16 Nov).
    set_by: Shoaib Khan
    date: 2026-11-12
    checks: []
    status: active
  - id: AUD-4
    rule: A false finding that was published is deleted, never marked fixed; an LLM answer that is real but mislabelled is recorded as reviewed and counted by a deterministic check.
    why: The report must never claim a fix that did not happen.
    set_by: Shoaib Khan
    date: 2026-10-20
    checks: []
    status: active
  - id: PROC-1
    rule: "Each push to a blog repo is approved by SK at that time; the commit says what and why, how it was tested, and ends with \"Fixed by Health and Recovery Agent\"."
    why: Phase 1 is audit only; fixes happen one approval at a time.
    set_by: Shoaib Khan
    date: 2026-11-03
    checks: []
    status: active
  - id: PROC-2
    rule: Template changes are tested with the deploy's Hugo version (full build before/after on small blogs) and the commit check before the push; verified live after the deploy.
    why: The 3 Nov head bug showed only on translated pages and touched no post.
    set_by: Health and Recovery Agent
    date: 2026-11-11
    checks: []
    status: active
  - id: PROC-3
    rule: "An issue found by hand (by Shoaib Khan or anyone) and fixed by the agent is logged as a row in reports/<tenant>/agent-fixes.json with found_by, and becomes an audit check when it can recur."
    why: A scan sees only the current state, so a problem fixed before the next scan would leave no trace in the reports.
    set_by: Shoaib Khan
    date: 2026-11-12
    checks: []
    status: active
  - id: AI-1
    rule: llms.txt is built from the content on every deploy (Hugo output format and template), never edited by hand; it lists the newest posts.
    why: Posts, translations and optimised titles land daily; a hand-made file went stale within a day (12 Nov 2026).
    set_by: Shoaib Khan
    date: 2026-11-12
    checks: [llms_txt_missing, llms_txt_outdated]
    status: active
