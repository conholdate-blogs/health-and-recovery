# Tenant config: everything specific to conholdate.cloud lives here, nothing in core/ or agents/.
# Tenant 2 (SK, 2026-10-20): only blog.conholdate.cloud for now; other conholdate.cloud hosts may be added later.
property: conholdate.cloud

# Hosts matching these patterns are never crawled or checked (blog-qa.conholdate.cloud is the staging blog).
excluded_host_patterns:
  - "*-qa.*"

# Service account sk-serv-acc@health-and-recovery (SK, 2026-10-20; later for all tenants): .env variable with its key path.
google_credentials_env: GOOGLE_CREDENTIALS_HEALTH_AND_RECOVERY

gsc_properties:              # URL-prefix properties the service account can read (Restricted, 2026-10-20)
  - https://blog.conholdate.cloud/
ga4_property_id: "253119926"   # SK, 2026-10-20

hosts:
  - host: blog.conholdate.cloud
    platform: hugo            # PaperMod theme, 23 languages, hugo deploy to S3 (us-west-2)
    repo: github.com/conholdate-cloud/blog.conholdate.cloud
    local_path: /Users/Apple/Work/Aspose/GitHub/blog.conholdate.cloud-PROD/blog.conholdate.cloud
    hugo_version: "0.101.0"   # production deploy (11 Nov 2026); test template changes with this version
    sitemap: https://blog.conholdate.cloud/sitemap.xml       # index of 23 language sitemaps
    robots: https://blog.conholdate.cloud/robots.txt
    fix_channel: git-pr

# Language prefixes from the blog's config.yml (English has no prefix).
languages: [en, ar, cs, de, es, fa, fr, he, id, it, ja, ko, nl, pl, pt, ru, sv, th, tr, uk, vi, zh, zh-hant]

# Supported translations (SK, 2026-10-22; matches the repo).
translation_languages: [ar, cs, de, es, fa, fr, he, id, it, ja, ko, nl, pl, pt, ru, sv, th, tr, uk, vi, zh, zh-hant]

audit:
  # no extra_urls for listing pages: 5 posts fit on one page (/page/2/ is a 404), 13 Nov 2026
  default_lang: en
  links:                     # link audit (scripts/audit_links.py): commits that count as translation work
    translation_commits: '^(Translate articles for|Daily Blogs Translation)'   # SK's translation agent
  text:                      # text check (scripts/audit_text.py)
    ignore:                  # reviewed LLM answers (url, wrong text); reason after each
      # English home title/description on translated home pages: real, but counted exactly by the crawl checks
      # title_untranslated / description_untranslated (all 22 languages), not as "a different product"
      - {url: "https://blog.conholdate.cloud/uk/", wrong: "File Format and Document Processing APIs | Conholdate Cloud"}
      - {url: "https://blog.conholdate.cloud/uk/", wrong: "File Format and Document Processing APIs for document automation of almost all the popular file formats."}
      - {url: "https://blog.conholdate.cloud/ja/", wrong: "File Format and Document Processing APIs | Conholdate Cloud"}
      - {url: "https://blog.conholdate.cloud/ja/", wrong: "File Format and Document Processing APIs for document automation of almost all the popular file formats."}
      # home title = the site's tagline, H1 = the blog name (same as the English home): not a different product
      - {url: "https://blog.conholdate.cloud/fr/", wrong: "API de formats de fichiers et de documents | Conholdate Cloud"}
      - {url: "https://blog.conholdate.cloud/fr/", wrong: "API de traitement de formats de fichiers et de documents pour automatiser presque tous les formats de fichiers populaires."}

# URL templates per host, matched in order against the path with the language segment removed.
url_templates:
  blog.conholdate.cloud:
    - {name: home, pattern: '^/$'}
    - {name: listing, pattern: '^/(?P<listing>archives|search|categories|tags)/?$'}
    - {name: tag, pattern: '^/tag/(?P<tag>[^/]+)/?$'}   # /tag/<name>/ (config.yml permalinks), before post
    - {name: post, pattern: '^/(?P<category>[^/]+)/(?P<slug>[^/]+)/?$'}
    - {name: category, pattern: '^/(?P<category>[^/]+)/?$'}

# Snapshot of GSC -> Sitemaps for https://blog.conholdate.cloud/ (read with the gsc MCP server list_sitemaps, 2026-10-26).
# Discovery re-reads live sitemaps; this is the baseline to compare against.
gsc_sitemaps_snapshot:
  property: https://blog.conholdate.cloud/
  taken: "2026-10-26"
  sitemaps:
    - {path: "/sitemap.xml", type: "Sitemap index", submitted: "2025-08-07", last_read: "2026-10-17", status: "Success", discovered: 172}

# Report options (SK, 2026-10-27): the Overview layout as on aspose.cloud: health by area, Overview first
# (score tiles, subdomain rows, top actions required), details after.
report:
  area_scores: true
  manager_view: true

# Cross-domain pages this tenant's hosts appear on (SK, 2026-10-27: /blogs/ lists every blog).
collections:
  blogs: [blog.conholdate.cloud]
