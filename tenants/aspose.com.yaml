# Tenant config: everything specific to aspose.com lives here, nothing in core/ or agents/.
# Tenant 5 (SK, 2026-11-02): only blog.aspose.com for now; other aspose.com hosts may be added later.
property: aspose.com

# Hosts matching these patterns are never crawled or checked (blog-qa.aspose.com is the staging blog).
excluded_host_patterns:
  - "*-qa.*"

# Service account sk-serv-acc@health-and-recovery (same key as the .cloud tenants).
google_credentials_env: GOOGLE_CREDENTIALS_HEALTH_AND_RECOVERY

gsc_properties:              # URL-prefix properties the service account can read (Restricted, seen 2026-11-02)
  - https://blog.aspose.com/
ga4_property_id: "252213002"   # SK, 2026-10-22

hosts:
  - host: blog.aspose.com
    platform: hugo            # PaperMod theme; S3 + CloudFront (2026-11-02)
    repo: github.com/Aspose/aspose-blog
    local_path: /Users/Apple/Work/Aspose/GitHub/blog.aspose.com-PROD/aspose-blog
    hugo_version: "0.120.4"   # production deploy (11 Nov 2026); test template changes with this version
    sitemap: https://blog.aspose.com/sitemap.xml       # index of 22 language sitemaps
    robots: https://blog.aspose.com/robots.txt
    fix_channel: git-pr

# Language prefixes from the sitemap index (English URLs have no prefix, its sitemap is /en/sitemap.xml).
languages: [en, ja, ko, es, de, ru, fr, zh, it, pt, ar, vi, zh-hant, tr, id, th, fa, pl, uk, he, cs, sv]

# Supported translations (SK, 2026-10-22). Repo count 2026-10-22: 6,432 posts, 2,420 complete, 3,977 English only,
# 35 partial (old 2013-2019 posts).
translation_languages: [ar, cs, de, es, fa, fr, he, id, it, ja, ko, pl, pt, ru, sv, th, tr, uk, vi, zh, zh-hant]

audit:
  extra_urls:                # listing pages 2+ are in no sitemap, so the crawl never sampled them (13 Nov 2026, AUD-3)
    - https://blog.aspose.com/p/2/
    - https://blog.aspose.com/de/p/2/
  default_lang: en
  per_template_by_host:      # same sample as the .cloud blogs (SK's option A, 2026-10-22); 57.5k sitemap URLs
    blog.aspose.com: 20
  links:                     # link audit (scripts/audit_links.py): commits that count as translation work
    translation_commits: '^(Translate articles for|Daily Blogs Translation)'   # SK's translation agent
    max_live: 20000          # the default 5000 left 5,273 of 10,273 targets unchecked (2026-11-03)

# URL templates per host, matched in order against the path with the language segment removed.
# Hugo paginates under /p/ here (paginatePath), so /page/<slug>/ are posts of Aspose.Page.
url_templates:
  blog.aspose.com:
    - {name: home, pattern: '^/$'}
    - {name: listing, pattern: '^/(?P<listing>archives|search|categories|tags)/?$'}
    - {name: tag, pattern: '^/tag/(?P<tag>[^/]+)/?$'}
    - {name: post, pattern: '^/(?P<category>[^/]+)/(?P<slug>[^/]+)/?$'}
    - {name: category, pattern: '^/(?P<category>[^/]+)/?$'}

# Snapshot of GSC -> Sitemaps for https://blog.aspose.com/ (read with the gsc MCP server list_sitemaps, 2026-11-02).
# Discovery re-reads live sitemaps; this is the baseline to compare against. Root index only: the 22 language
# sitemaps were also submitted one by one (2024-02-21), but listing them here takes their URLs off the index's count.
# "Success" = no errors (the API gives errors and warnings, no status word); es/sitemap.xml has 1 warning.
gsc_sitemaps_snapshot:
  property: https://blog.aspose.com/
  taken: "2026-11-02"
  sitemaps:
    - {path: "/sitemap.xml", type: "Sitemap index", submitted: "2025-04-10", last_read: "2026-10-27", status: "Success", discovered: 57539}

# Report options: the Overview layout, as on every tenant.
report:
  area_scores: true
  manager_view: true

# Cross-domain pages this tenant's hosts appear on (SK, 2026-10-27: /blogs/ lists every blog).
collections:
  blogs: [blog.aspose.com]
