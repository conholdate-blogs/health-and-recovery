# Tenant config: everything specific to conholdate.com lives here, nothing in core/ or agents/.
# Tenant 6 (SK, 2026-11-02): only blog.conholdate.com for now; other conholdate.com hosts may be added later.
property: conholdate.com

# Hosts matching these patterns are never crawled or checked (blog-qa.conholdate.com is the staging blog).
excluded_host_patterns:
  - "*-qa.*"

# Service account sk-serv-acc@health-and-recovery (same key as the .cloud tenants).
google_credentials_env: GOOGLE_CREDENTIALS_HEALTH_AND_RECOVERY

gsc_properties:              # URL-prefix properties the service account can read (Restricted, seen 2026-11-02)
  - https://blog.conholdate.com/
ga4_property_id: "252867297"   # SK, 2026-10-22

hosts:
  - host: blog.conholdate.com
    platform: hugo            # PaperMod theme; S3 + CloudFront (2026-11-02)
    repo: github.com/conholdate/conholdate-blog
    local_path: /Users/Apple/Work/Aspose/GitHub/blog.conholdate.com-PROD/conholdate-blog
    hugo_version: "0.101.0"   # production deploy (11 Nov 2026); test template changes with this version
    sitemap: https://blog.conholdate.com/sitemap.xml       # index of 18 language sitemaps
    robots: https://blog.conholdate.com/robots.txt
    fix_channel: git-pr

# Language prefixes from the sitemap index (English URLs have no prefix, its sitemap is /en/sitemap.xml).
languages: [en, ja, ko, es, de, ru, fr, zh, it, pt, nl, vi, th, id, ar, fa, tr, pl]

# Supported translations (SK, 2026-10-22). Repo count 2026-10-22: 548 posts, 547 complete, 1 English only.
translation_languages: [ar, de, es, fa, fr, id, it, ja, ko, nl, pl, pt, ru, th, tr, vi, zh]

audit:
  extra_urls:                # listing pages 2+ are in no sitemap, so the crawl never sampled them (13 Nov 2026, AUD-3)
    - https://blog.conholdate.com/page/2/
    - https://blog.conholdate.com/fr/page/2/
  default_lang: en
  per_template_by_host:      # same sample as the .cloud blogs (SK's option A, 2026-10-22); 53.5k sitemap URLs
    blog.conholdate.com: 20
  links:                     # link audit (scripts/audit_links.py): commits that count as translation work
    translation_commits: '^(Translate articles for|Daily Blogs Translation)'   # SK's translation agent
  repo:                      # repo file check: reviewed redirect keys that look like junk but really existed
    redirect_keep:           # SK, 2026-11-13: old URLs of the 15 French posts moved to /fr/<English url>/ (B2)
      - {key: '/fr/total/créez-votre-propre-application-google-docs-like/', reason: old URL of a moved French post}
      - {key: '/fr/total/créez-votre-propre-application-google-docs-like-part-two/', reason: old URL of a moved French post}
      - {key: '/fr/total/offre-rabais-fin-bientôt/', reason: old URL of a moved French post}
      - {key: '/fr/total/convertir-jpg-en-png-ou-pdf-en-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/générer-des-rapports-à-partir-de-données-excel-dans-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/rechercher-un-mot-dans-pdf-en-utilisant-java/', reason: old URL of a moved French post}
      - {key: '/fr/total/annoter-les-images-jpg-avec-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/masquer-et-afficher-les-lignes-ou-les-colonnes-dans-excel-en-utilisant-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/comparer-deux-ou-plus-mot-documents-en-utilisant-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/extraire-texte-des-documents-word-en-utilisant-java/', reason: old URL of a moved French post}
      - {key: '/fr/total/ajouter-texte-ou-image-filigranes-dans-word-documents-using-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/recadrer-et-redimensionner-les-images-jpeg-en-utilisant-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/appliquer-les-formules-les-plus-utilisees-dans-excel-en-utilisant-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/rendre-présentation-powerpoint-en-utilisant-csharp/', reason: old URL of a moved French post}
      - {key: '/fr/total/extraire-texte-et-images-des-documents-pdf-en-utilisant-java/', reason: old URL of a moved French post}
      - {key: '/fr/2020/06/29/créez-votre-propre-application-google-docs-like-part-two/', reason: old URL of a moved French post}
      - {key: '/fr/2022/03/29/rendre-présentation-powerpoint-en-utilisant-csharp/', reason: old URL of a moved French post}

# URL templates per host, matched in order against the path with the language segment removed.
# Tag pages are /tag/<name>/; they must match before post.
url_templates:
  blog.conholdate.com:
    - {name: home, pattern: '^/$'}
    - {name: listing, pattern: '^/(?P<listing>archives|search|categories|tags)/?$'}
    - {name: tag, pattern: '^/tag/(?P<tag>[^/]+)/?$'}
    - {name: post, pattern: '^/(?P<category>[^/]+)/(?P<slug>[^/]+)/?$'}
    - {name: category, pattern: '^/(?P<category>[^/]+)/?$'}

# Snapshot of GSC -> Sitemaps for https://blog.conholdate.com/ (read with the gsc MCP server list_sitemaps, 2026-11-02).
# Discovery re-reads live sitemaps; this is the baseline to compare against.
gsc_sitemaps_snapshot:
  property: https://blog.conholdate.com/
  taken: "2026-11-02"
  sitemaps:
    - {path: "/sitemap.xml", type: "Sitemap index", submitted: "2023-05-26", last_read: "2026-10-30", status: "Success", discovered: 53533}

# Report options: the Overview layout, as on every tenant.
report:
  area_scores: true
  manager_view: true

# Cross-domain pages this tenant's hosts appear on (SK, 2026-10-27: /blogs/ lists every blog).
collections:
  blogs: [blog.conholdate.com]
